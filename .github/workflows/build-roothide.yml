name: Build Better3DMenus16-RH

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Tweak.xm'
      - 'Makefile'
      - 'control'
      - 'layout/**'
      - 'better3dmenus16rhprefs/**'
      - '.github/workflows/build-roothide.yml'

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install RootHide Theos
        env:
          THEOS: ${{ github.workspace }}/.theos
        run: |
          set -euxo pipefail
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"
          echo "THEOS=${THEOS}" >> "$GITHUB_ENV"

      - name: Install patched iOS 16.5 SDK
        run: |
          set -euxo pipefail
          mkdir -p "$THEOS/sdks"
          curl -L --fail --retry 3 \
            -o /tmp/iPhoneOS16.5.sdk.tar.xz \
            https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz
          tar -xJf /tmp/iPhoneOS16.5.sdk.tar.xz -C "$THEOS/sdks"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"
          test -e "$THEOS/sdks/iPhoneOS16.5.sdk/System/Library/PrivateFrameworks/Preferences.framework/Preferences.tbd"

      - name: Build RootHide package
        run: |
          set -euxo pipefail
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          ls -lah packages

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: Better3DMenus16-RH-v0.1
          path: packages/*.deb
          if-no-files-found: error
